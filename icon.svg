<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    width="100%"
    height="100%"
>
  <!-- Outer Flat Surface Container -->
  <circle cx="256" cy="256" r="240" fill="#1D192B" />

  <!-- 2x2 Material 3 Expressive Flat Shape Grid Body -->
  <!-- Scale easily by changing scale(1): e.g. scale(0.9) to scale down, scale(1.1) to scale up -->
  <g
        id="icons-2x2"
        transform="translate(256 256) scale(1) translate(-256 -256)"
    >
    <!-- TOP-LEFT: Plus (+) Expressive Squircle (Primary) -->
    <g id="icon-plus">
      <rect
                x="104.8"
                y="104.8"
                width="138.6"
                height="138.6"
                rx="46.8"
                fill="#D0BCFF"
            />
      <g stroke="#381E72" stroke-width="19.8" stroke-linecap="round">
        <line x1="174.1" y1="145.3" x2="174.1" y2="202.9" />
        <line x1="145.3" y1="174.1" x2="202.9" y2="174.1" />
      </g>
    </g>

    <!-- TOP-RIGHT: Minus (-) Expressive Circle (Secondary Container) -->
    <g id="icon-minus">
      <rect
                x="268.6"
                y="104.8"
                width="138.6"
                height="138.6"
                rx="69.3"
                fill="#4A4458"
            />
      <g stroke="#E8DEF8" stroke-width="19.8" stroke-linecap="round">
        <line x1="309.1" y1="174.1" x2="366.7" y2="174.1" />
      </g>
    </g>

    <!-- BOTTOM-LEFT: Multiply (×) Expressive Rounded Square (Secondary Container) -->
    <g id="icon-multiply">
      <rect
                x="104.8"
                y="268.6"
                width="138.6"
                height="138.6"
                rx="41.4"
                fill="#4A4458"
            />
      <g stroke="#E8DEF8" stroke-width="19.8" stroke-linecap="round">
        <line x1="151.6" y1="315.4" x2="196.6" y2="360.4" />
        <line x1="196.6" y1="315.4" x2="151.6" y2="360.4" />
      </g>
    </g>

    <!-- BOTTOM-RIGHT: Divide (÷) Expressive Teardrop (Tertiary) -->
    <g id="icon-divide">
      <path
                d="M 302.8 268.6 H 337.9 A 69.3 69.3 0 0 1 407.2 337.9 V 337.9 A 69.3 69.3 0 0 1 337.9 407.2 H 337.9 A 69.3 69.3 0 0 1 268.6 337.9 V 302.8 A 34.2 34.2 0 0 1 302.8 268.6 Z"
                fill="#EFB8C8"
            />
      <g stroke="#492532" fill="#492532" stroke-linecap="round">
        <line x1="309.1" y1="337.9" x2="366.7" y2="337.9" stroke-width="19.8" />
        <circle cx="337.9" cy="310" r="9.9" stroke="none" />
        <circle cx="337.9" cy="365.8" r="9.9" stroke="none" />
      </g>
    </g>
  </g>
</svg>
